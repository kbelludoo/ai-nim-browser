name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jiro4989/setup-nim-action@v2
        with:
          nim-version: '2.2.0'
      - name: Run differential parity report
        run: nim c -r -d:release tests/parity_report.nim
      - name: Build CLI executable
        run: nim c -d:release --opt:size -o:ai-nim-browser src/cli/main.nim
